(function(){if(location.protocol!=='file:')return;
let syncHandle=null,syncTimer=null;const DBNAME='life-journal-sync',STORE='handles',HANDLEKEY='onedrive-json';
function openSyncDb(){return new Promise(function(resolve,reject){let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}

function status(text,type){let el=document.querySelector('#cloudStatus');if(!el)return;el.textContent=text;el.className='cloud-status '+(type||'')}
function updateCloudStatus(){if(syncHandle)status('已连接：'+syncHandle.name+'。内容修改后会自动写入此文件。','connected');else if(window.showSaveFilePicker)status('尚未连接 OneDrive 同步文件。');else status('当前浏览器不支持直接写入文件，请使用下方“导出”和“从 OneDrive 导入”。')}

async function writeCloud(silent){if(!syncHandle)return false;try{if(!await ensurePermission(syncHandle)){if(!silent)status('未获得文件写入权限。','error');return false}data.oneDriveSyncedAt=new Date().toISOString();let w=await syncHandle.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();status('已同步到 OneDrive · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),'connected');return true}catch(e){status('同步失败：请重新连接同步文件。','error');return false}}
function queueCloud(){if(!syncHandle)return;clearTimeout(syncTimer);syncTimer=setTimeout(function(){writeCloud(true)},1200)}
let priorSave=save;save=function(){priorSave();queueCloud()};
let btn=document.createElement('button');btn.className='onedrive-btn';btn.id='oneDriveBtn';btn.textContent='☁ OneDrive 同步';document.querySelector('#modal .data').appendChild(btn);
let modal=document.createElement('div');modal.className='modal-bg hidden';modal.id='oneDriveModal';modal.innerHTML='<section class="modal cloud-card"><div class="modal-head"><div><div class="cloud-logo">☁</div><h2>OneDrive 同步</h2></div><button class="close" id="cloudClose">×</button></div><div class="cloud-status" id="cloudStatus"></div><div class="cloud-actions"><button class="primary" id="cloudConnect">连接 OneDrive 文件</button><button id="cloudWrite">立即上传最新数据</button><button id="cloudRead">读取 OneDrive 数据</button><button id="cloudExport">导出同步文件</button></div><input id="cloudFileInput" type="file" accept="application/json,.json" hidden><p class="cloud-help">电脑端：请选择 OneDrive 同步文件夹内的“随手帐同步数据.json”，连接后将自动保存。<br>手机端：点击“读取 OneDrive 数据”，通过系统文件选择器选择 OneDrive 中的同步文件；上传时使用“导出同步文件”并保存到 OneDrive。</p></section>';document.body.appendChild(modal);
btn.onclick=function(){modal.classList.remove('hidden');updateCloudStatus()};document.querySelector('#cloudClose').onclick=function(){modal.classList.add('hidden')};modal.onclick=function(e){if(e.target===modal)modal.classList.add('hidden')};
document.querySelector('#cloudConnect').onclick=async function(){if(!window.showSaveFilePicker){status('当前浏览器不支持直接连接，请使用导出与读取方式。','error');return}try{syncHandle=await showSaveFilePicker({suggestedName:'随手帐同步数据.json',types:[{description:'随手帐数据',accept:{'application/json':['.json']}}]});await rememberHandle(syncHandle);await writeCloud(false)}catch(e){if(e.name!=='AbortError')status('连接失败，请重试。','error')}};

document.querySelector('#cloudExport').onclick=downloadCloud;function downloadCloud(){data.oneDriveSyncedAt=new Date().toISOString();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='随手帐同步数据.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);status('同步文件已生成，请将它保存到 OneDrive。','connected')}

async function importCloudText(text){try{let imported=JSON.parse(text);if(!imported||!Array.isArray(imported.entries))throw new Error();let when=imported.oneDriveSyncedAt?new Date(imported.oneDriveSyncedAt).toLocaleString('zh-CN'):'未知时间';if(!confirm('使用 OneDrive 数据覆盖本机数据？\n云端更新时间：'+when))return;data=imported;localStorage.setItem(KEY,JSON.stringify(data));location.reload()}catch(e){status('所选文件不是有效的随手帐同步数据。','error')}}
loadHandle();
})();

<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<script id="graph-sync-script">
(function(){
const CLIENT_KEY='life-journal-ms-client-id';
const SCOPES=['Files.ReadWrite.AppFolder'];
const GRAPH_ROOT='https://graph.microsoft.com/v1.0/me/drive/special/approot';
let appRootId=null;
let app=null,account=null,uploadTimer=null,busy=false;
function q(s){return document.querySelector(s)}
function state(text,type){let e=q('#msStatus');if(!e)return;e.textContent=text;e.className='ms-status '+(type||'')}
function clientId(){return localStorage.getItem(CLIENT_KEY)||'8b3472ce-d1b8-4bf6-99fe-b01b37abeced'}
function makeApp(){
  if(app||!clientId()||!window.msal)return app;
  app=new msal.PublicClientApplication({auth:{clientId:clientId(),authority:'https://login.microsoftonline.com/common',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}});
  account=app.getAllAccounts()[0]||null;
  return app;
}
async function token(interactive){
  makeApp();
  if(!app)throw new Error('请先填写 Microsoft 应用编号');
  if(!account)throw new Error('请先登录 Microsoft 账户')
  if(!account)throw new Error('请先登录 Microsoft 账户');
  try{return(await app.acquireTokenSilent({scopes:SCOPES,account:account})).accessToken}
  catch(e){if(!interactive)throw e;await app.acquireTokenRedirect({scopes:SCOPES,account:account});throw new Error('正在转到 Microsoft 重新登录…')}
}
async function graph(method,body,interactive){
  let access=await token(interactive!==false),headers={Authorization:'Bearer '+access};
  if(!appRootId){
    let root=await fetch(GRAPH_ROOT,{headers:{Authorization:'Bearer '+access}});
    if(!root.ok)throw new Error('无法打开 OneDrive 应用文件夹（'+root.status+'）');
    appRootId=(await root.json()).id;
  }
  let fileUrl='https://graph.microsoft.com/v1.0/me/drive/items/'+encodeURIComponent(appRootId)+':/journal-data.json:/content';
  if(body!==undefined)headers['Content-Type']='application/json; charset=utf-8';
  return fetch(fileUrl,{method:method,headers:headers,body:body});
}
async function upload(silent){
  if(busy||!account)return false;
  busy=true;
  try{
    data.oneDriveSyncedAt=new Date().toISOString();
    localStorage.setItem(KEY,JSON.stringify(data));
    let r=await graph('PUT',JSON.stringify(data));
    if(!r.ok)throw new Error('上传失败（'+r.status+'）');
    state('已同步到 OneDrive · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),'ok');
    return true;
  }catch(e){if(!silent)state(e.message||'同步失败','error');return false}
  finally{busy=false}
}
function queue(){if(!account)return;clearTimeout(uploadTimer);uploadTimer=setTimeout(function(){upload(true)},1400)}
async function downloadAndMerge(forceCloud){
  if(busy)return;busy=true;
  try{
    let r=await graph('GET');
    if(r.status===404){busy=false;await upload(false);return}
    if(!r.ok)throw new Error('读取失败（'+r.status+'）');
    let cloud=await r.json();
    if(!cloud||!Array.isArray(cloud.entries))throw new Error('云端数据格式无效');
    let cloudTime=Date.parse(cloud.oneDriveSyncedAt||0),localTime=Date.parse(data.oneDriveSyncedAt||0);
    if(forceCloud||cloudTime>localTime){
      data=cloud;localStorage.setItem(KEY,JSON.stringify(data));
      state('已从 OneDrive 下载数据 · '+(cloud.oneDriveSyncedAt?new Date(cloud.oneDriveSyncedAt).toLocaleString('zh-CN'):'时间未知'),'ok');setTimeout(function(){location.reload()},700);return
    }
    if(localTime>cloudTime){busy=false;await upload(false);return}
    state('电脑与手机数据已是最新','ok');
  }catch(e){state(e.message||'读取失败','error')}
  finally{busy=false}
}
function refresh(){
  makeApp();let id=clientId();q('#msClientId').value=id;
  if(!id)state('请先填写 Microsoft 应用编号。');
  else if(!window.msal)state('Microsoft 登录组件载入失败，请检查网络。','error');
  else if(account)state('已登录：'+(account.username||account.name||'Microsoft 账户'),'ok');
  else state('应用编号已保存，请登录 Microsoft 账户。');
  q('#msLogin').textContent=account?'切换账户':'登录 Microsoft';
}
let host=q('#modal .data');
if(!host)return;
let button=document.createElement('button');button.id='msOneDriveBtn';button.className='ms-sync-btn';button.textContent='☁ Microsoft OneDrive';host.appendChild(button);
let modal=document.createElement('div');modal.className='modal-bg hidden';modal.id='msOneDriveModal';
modal.innerHTML='<section class="modal ms-card"><div class="modal-head"><h2>Microsoft OneDrive 自动同步</h2><button class="close" id="msClose">×</button></div><div class="ms-form"><label>Microsoft 应用程序（客户端）ID<input id="msClientId" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><button id="msSaveId">保存应用编号</button><div class="ms-status" id="msStatus"></div><div class="ms-actions"><button class="primary" id="msLogin">登录 Microsoft</button><button id="msSync">立即同步</button><button id="msUpload">用本机数据覆盖云端</button><button id="msLogout">退出 Microsoft</button></div><p class="ms-sync-note">数据文件只保存在 OneDrive 的应用专用文件夹中，文件名为 journal-data.json。修改内容后约 1.4 秒自动上传。</p><p class="ms-sync-note">注册 Microsoft 单页应用时，请填写重定向地址：</p><div class="ms-redirect">'+location.origin+location.pathname+'</div></div></section>';
document.body.appendChild(modal);
button.onclick=function(){modal.classList.remove('hidden');refresh()};
q('#msClose').onclick=function(){modal.classList.add('hidden')};modal.onclick=function(e){if(e.target===modal)modal.classList.add('hidden')};
q('#msSaveId').onclick=function(){let id=q('#msClientId').value.trim();if(!/^[0-9a-f-]{36}$/i.test(id)){state('应用编号格式不正确。','error');return}localStorage.setItem(CLIENT_KEY,id);app=null;account=null;refresh()};
q('#msLogin').onclick=async function(){try{app=null;account=null;makeApp();sessionStorage.setItem('life-journal-sync-after-login','1');await app.loginRedirect({scopes:SCOPES,prompt:'select_account'})}catch(e){state((e&&e.message)||'登录未完成','error')}};
q('#msSync').onclick=async function(){try{makeApp();account=app&&app.getAllAccounts()[0];if(!account)throw new Error('请先登录 Microsoft 账户');state('正在从 OneDrive 下载手机端数据…');await downloadAndMerge(true)}catch(e){state(e.message,'error')}};
q('#msUpload').onclick=async function(){try{makeApp();account=app&&app.getAllAccounts()[0];if(!account)throw new Error('请先登录 Microsoft 账户');if(confirm('确定用本机数据覆盖 OneDrive 中的手账数据吗？'))await upload(false)}catch(e){state(e.message,'error')}};
q('#msLogout').onclick=async function(){makeApp();if(app&&account)await app.logoutRedirect({account:account,postLogoutRedirectUri:location.origin+location.pathname});account=null;refresh()};
let oldSave=save;save=function(){oldSave();queue()};
setTimeout(async function(){try{makeApp();if(app){let response=await app.handleRedirectPromise();account=(response&&response.account)||app.getAllAccounts()[0]||null;refresh();if(account){let first=sessionStorage.getItem('life-journal-sync-after-login')==='1';sessionStorage.removeItem('life-journal-sync-after-login');if(first||data.oneDriveSyncedAt)await downloadAndMerge()}}}catch(e){state((e&&e.message)||'Microsoft 登录未完成','error')}},500);
})();
